<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }

    .header {
      background: #ffe600;
      padding: 18px;
    }

    .container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    .card {
      background: #fff;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #ffe600;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="header"></div>

  <div class="container">
    <div class="card">
      <h2>Preencha seus dados para cadastro</h2>

      <label>CPF</label>
      <input type="text" placeholder="000.000.000-00">

      <!-- BOTÃO FUNCIONANDO -->
      <button type="button" onclick="irParaProximaPagina()">
        Continuar
      </button>
    </div>
  </div>

  <script>
    function irParaProximaPagina() {
      window.location.href = "/online/5/index.html/";
    }
  </script>

</body>
</html>
